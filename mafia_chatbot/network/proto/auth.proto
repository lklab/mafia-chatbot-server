syntax = "proto3";

message UserInfo {
  string clientId = 1;
  string name = 2;
}

message Auth {
  string rqid = 1;
  string clientId = 2;
}

message AuthResponse {
  string rqid = 1;
  UserInfo userInfo = 2;
}

message UpdateUserInfo {
  string rqid = 1;
  UserInfo userInfo = 2;
}

message UpdateUserInfoResponse {
  string rqid = 1;
}
