syntax = "proto3";

package game_pb;

import "game_data.proto";

message CheckCurrentGame { }

message CurrentGame {
  bool isGameExists = 1;
  int32 port = 2;
}

message RequestCurrentGameInfo { }

message CurrentGameInfo {
  game_data_pb.GameInfo info = 1;
}

message ReadyGame { }

message ReadyGameResponse { }

message RequestGamePhase { }

message GamePhase {
  int32 round = 1;
  game_data_pb.Phase phase = 2;
  float phaseEndTime = 3;
  float phaseRemainTime = 4;
}

message RequestGameState { }

message GameState {
  string language = 1;
  repeated game_data_pb.Player players = 2;
  game_data_pb.Player me = 3;

  int32 mafiaCount = 4;
  int32 remainMafiaCount = 5;

  GamePhase phase = 6;

  int32 remainMyChat = 7;
  int32 maxMyChat = 8;

  bool canCancelKillWithAds = 9;
}

message RequestChatList { }

message ChatList {
  repeated game_data_pb.Chat chats = 1;
}

message RequestAddChat {
  game_data_pb.Chat chat = 1;
}

message GetChat {
  int32 index = 1;
}

message AddChat {
  game_data_pb.Chat chat = 1;
  int32 remainMyChat = 2;
  int32 maxMyChat = 3;
}

message SetTarget {
  game_data_pb.TargetType type = 1;
  string target = 2;
}

message SetTargetResponse { }

message GetVoteState {
  game_data_pb.TargetType type = 1;
}

message VoteState {
  game_data_pb.TargetType type = 1;
  map<string, game_data_pb.Voters> votersMap = 2;
}

message Removed {
  game_data_pb.RemoveReason reason = 1;
}

message GameEnd {
  game_data_pb.GameEndReason reason = 1;
}

message QuitGame { }

message QuitGameResponse { }

message ReportChat {
  string reporterId = 1;
  int32 chatIndex = 2;
  string comment = 3;
}

message ReportChatResponse { }

message CanCancelKillWithAds { }

message CancelKillWithAds {
  bool cancel = 1;
}

message CancelKillWithAdsResponse { }

message UnlockAchievement {
  string achievementKey = 1;
}
