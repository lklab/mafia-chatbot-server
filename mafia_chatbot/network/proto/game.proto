syntax = "proto3";

message DebugInfo {
  bool isDebug = 1;
  Role fixedRole = 2;
  string fixedRoleClientId = 3;
  int32 daySeconds = 4;
  int32 eveningSeconds = 5;
  int32 nightSeconds = 6;
  bool useLLM = 7;
  string nonTargetableClientId = 8;
  string observerClientId = 9;
  bool continueOnlyBots = 10;
}

message CheckCurrentGame {
  string rqid = 1;
}

message CurrentGame {
  string rqid = 1;
  bool isGameExists = 2;
  int32 port = 3;
}

message RequestGameInfo {
  string rqid = 1;
}

message GameInfo {
  string rqid = 1;
  int32 playerCount = 2;
  int32 mafiaCount = 3;
  string language = 4;
  DebugInfo debugInfo = 5;
}

message GameStart {
  string rqid = 1;
  GameInfo info = 2;
}

message GameStartResponse {
  string rqid = 1;
}

enum Role {
  Role_UNKNOWN = 0;
  Role_CITIZEN = 1;
  Role_MAFIA = 2;
  Role_POLICE = 3;
  Role_DOCTOR = 4;
}

enum RemoveReason {
  REMOVE_UNKNOWN = 0;
  REMOVE_LIVE = 1;
  REMOVE_EXECUTED = 2;
  REMOVE_ASSASSINATED = 3;
  REMOVE_OBSERVER = 4;
}

message Player {
  string id = 1;
  string name = 2;
  Role role = 3;
  bool isLive = 4;
  RemoveReason removeReason = 5;
}

enum Phase {
  Phase_UNKNOWN = 0;
  Phase_DAY = 1;
  Phase_EVENING = 2;
  Phase_NIGHT = 3;
}

message RequestGamePhase {
  string rqid = 1;
}

message GamePhase {
  string rqid = 1;
  int32 round = 2;
  Phase phase = 3;
  float phaseEndTime = 4;
  float phaseRemainTime = 5;
}

message RequestGameState {
  string rqid = 1;
}

message GameState {
  string rqid = 1;

  string language = 2;
  repeated Player players = 3;
  Player me = 4;

  int32 mafiaCount = 5;
  int32 remainMafiaCount = 6;

  GamePhase phase = 7;

  int32 remainMyChat = 8;
  int32 maxMyChat = 9;
}

enum ChatType {
  CHAT_UNKNOWN = 0;
  CHAT_SYSTEM = 1;
  CHAT_DISCUSSION = 2;
}

message Chat {
  string id = 1;
  ChatType type = 2;
  int32 index = 3;

  string sender = 4;
  string content = 5;
}

message RequestChatList {
  string rqid = 1;
}

message ChatList {
  string rqid = 1;
  repeated Chat chats = 2;
}

message RequestAddChat {
  string rqid = 1;
  Chat chat = 2;
}

message GetChat {
  string rqid = 1;
  int32 index = 2;
}

message AddChat {
  string rqid = 1;
  Chat chat = 2;
  int32 remainMyChat = 3;
  int32 maxMyChat = 4;
}

enum TargetType {
  TARGET_UNKNOWN = 0;
  TARGET_VOTE = 1;
  TARGET_KILL = 2;
  TARGET_TEST = 3;
  TARGET_HEAL = 4;
}

message SetTarget {
  string rqid = 1;
  TargetType type = 2;
  string target = 3;
}

message SetTargetResponse {
  string rqid = 1;
}

message GetVoteState {
  string rqid = 1;
}

message Voters {
  repeated string voters = 1;
}

message VoteState {
  string rqid = 1;
  map<string, Voters> votersMap = 2;
}

message Removed {
  string rqid = 1;
  RemoveReason reason = 2;
}

enum GameEndReason {
  GAME_END_UNKNOWN = 0;
  GAME_END_CITIZEN_WIN = 1;
  GAME_END_MAFIA_WIN = 2;
  GAME_END_NO_HUMAN_PLAYER = 3;
}

message GameEnd {
  string rqid = 1;
  GameEndReason reason = 2;
}

message QuitGame {
  string rqid = 1;
}

message QuitGameResponse {
  string rqid = 1;
}

message ReportChat {
  string rqid = 1;
  string reporterId = 2;
  int32 chatIndex = 3;
  string comment = 4;
}

message ReportChatResponse {
  string rqid = 1;
}
