syntax = "proto3";

message GameServerStarted {
  int32 port = 1;
}

message StartNewGame {
  string rqid = 1;
  string gameId = 2;
  repeated string clients = 3;
}

message StartNewGameResponse {
  string rqid = 1;
}

message ClientExited {
  string gameId = 1;
  string clientId = 2;
}

message GameEnded {
  string gameId = 1;
}
